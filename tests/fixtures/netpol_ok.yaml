# same namespace as the workload so the namespace counts as covered
apiVersion: v1
kind: Pod
metadata:
  name: shop-api
  namespace: shop
spec:
  containers:
    - name: api
      image: api:2.0
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: shop
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress

# first pod sets root explicitly, second pod sets nothing at all
apiVersion: v1
kind: Pod
metadata:
  name: explicit-root
spec:
  containers:
    - name: app
      image: app:1.0
      securityContext:
        runAsUser: 0
---
apiVersion: v1
kind: Pod
metadata:
  name: nothing-set
spec:
  containers:
    - name: app
      image: app:1.0

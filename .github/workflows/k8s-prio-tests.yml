# Runs the test suite on every push and pull request

# 3.10 is the declared minimum in pyproject.toml (requires-python = ">=3.10") and 3.14 is what the
# project is developed on
name: k8s-prio tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - run: pip install . pytest

      - name: Run tests
        # rather than fail: -rs lists what skipped and why
        run: pytest -q -rs
